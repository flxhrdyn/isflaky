[project]
name = "isflaky"
version = "0.1.0"
description = "Flaky test triage for CI, powered by TypeSafe Jev. Ships with a reproducible benchmark on real CI failures."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["typesafe-sdk>=0.7", "pyyaml>=6.0"]

[project.optional-dependencies]
mine = ["httpx>=0.27", "python-dotenv>=1.0"]
llm = ["groq>=0.11"]
bench = ["numpy>=1.26", "scipy>=1.11"]

[project.scripts]
isflaky-mine = "isflaky.mine.__main__:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11", "types-PyYAML>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/isflaky"]

[tool.hatch.build.targets.wheel.force-include]
"src/isflaky/engine/questions" = "isflaky/engine/questions"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.10"
strict = true
